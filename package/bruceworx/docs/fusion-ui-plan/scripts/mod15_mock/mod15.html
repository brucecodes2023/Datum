<html>
<head>

<style>

  .pill { display:inline-block; font-size:10px; font-weight:700; padding:0 5px; border-radius:4px; line-height:16px; letter-spacing:.2px; }
  .wip { color:var(--warn); background:var(--warnbg); }
  .rel { color:var(--ok); background:var(--okbg); }
  .mk { display:inline-flex; flex:none; margin:0 4px; width:18px; height:18px; border-radius:50%; background:#d2463c; color:#fff; font-weight:700;
        font-size:11px; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff; vertical-align:middle; }
  /* window */
  .win { position:relative; margin:18px; background:#f6f7f9; border:1px solid var(--border); border-radius:12px; overflow:hidden;

  .titlebar { height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; background:#eef0f3; border-bottom:1px solid var(--border); }
  .dots span { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; }
  .doctabs { display:flex; gap:2px; margin-left:16px; height:34px; align-items:flex-end; }
  .dt { padding:6px 12px 7px; border-radius:7px 7px 0 0; color:var(--sec); font-size:11.8px; display:flex; gap:6px; align-items:center; }

  .ico.asm { background:linear-gradient(135deg,#5b8def 0 50%,#2f6ad8 50%); }
  .ico.ws { background:#6a3fc8; color:#fff; font:700 10px/14px "Times New Roman", serif; text-align:center; }
  .toolbar { display:flex; align-items:center; gap:6px; padding:7px 14px; background:var(--card); border-bottom:1px solid var(--border); }

  .tb b { font-family:"Times New Roman", serif; font-style:italic; }
  .sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
  .seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; font-size:11.5px; }
  .seg div { padding:3px 10px; color:var(--sec); border-left:1px solid var(--border); }
  .seg div:first-child { border-left:none; }
  .seg div.on { background:var(--soft); color:var(--text); font-weight:600; }
  .live { color:var(--ok); font-size:11.5px; }
  .linkchip { margin-left:auto; display:flex; align-items:center; gap:7px; border:1px solid var(--border); border-radius:14px;
              padding:3px 10px 3px 6px; font-size:11.5px; color:var(--sec); }
  .linkchip .ok { color:var(--ok); font-weight:600; }
  .main { display:flex; height:1040px; }
  .canvas { flex:1; overflow:hidden; padding:18px 20px 0; position:relative; }
  .page { width:880px; margin:0 auto; background:var(--page); border:1px solid var(--border); border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.06);
          padding:26px 36px 20px; box-sizing:border-box; position:relative; }
  .ptitle { font-size:19px; font-weight:700; margin:0 0 4px; }
  .pmeta { color:var(--sec); font-size:11.5px; display:flex; gap:10px; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--border); }
  h2 { font-size:13.5px; margin:16px 0 6px; display:flex; align-items:center; gap:8px; }
  h2 .n { color:var(--sec); font-weight:600; }
  p { margin:4px 0 6px; line-height:1.55; }
  img.m { vertical-align:middle; }
  img.mi { vertical-align:-4px; }
  .calc { border-left:3px solid var(--soft); padding:2px 0 2px 12px; margin:4px 0 4px; position:relative; }
  .row { display:flex; align-items:center; min-height:34px; gap:10px; }
  .row .f { flex:none; }
  .row .eq { color:var(--text); font:15px "Times New Roman", serif; }
  .res { font:600 13px "SF Mono", Menlo, monospace; background:var(--soft); color:#123a7a; border-radius:4px; padding:1px 7px; }
  .res.w { background:var(--warnbg); color:var(--warn); }

  .chk.ok { color:var(--ok); background:var(--okbg); }
  .chk.warn { color:var(--warn); background:var(--warnbg); }
  .note { color:var(--sec); font-size:11.3px; }
  .spacer { flex:1; }
  .exp { font-size:11px; color:var(--link); background:var(--linkbg); border-radius:4px; padding:1px 6px; font-weight:600; white-space:nowrap; }
  .inputs { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 6px; }
  .in { border:1px solid var(--border); border-radius:5px; padding:1px 7px; font:13px "Times New Roman", serif; display:flex; gap:5px; align-items:center; }
  .in i { font-style:italic; }
  .in sub { font-size:10px; }
  .in .src { font:10.5px -apple-system, sans-serif; color:var(--link); }
  .edit { border:1px solid var(--accent); border-radius:6px; box-shadow:0 0 0 3px rgba(0,122,255,.15); margin:4px 0; overflow:hidden; }
  .edit .src { font:11.2px/1.6 "SF Mono", Menlo, monospace; padding:7px 10px; background:#fbfcfe; white-space:pre; border-bottom:1px solid var(--border); }
  .edit .src .c { color:#1e5fbf; } .edit .src .k { color:#a3306f; } .edit .src .cur { border-left:1.5px solid var(--text); }
  .edit .pv { padding:6px 10px; }
  .edit .bar { display:flex; gap:12px; font-size:11px; color:var(--sec); padding:3px 10px; background:var(--hover); border-top:1px solid var(--border); }
  .edit .bar b { color:var(--accent); font-weight:600; }
  .disp { text-align:center; margin:6px 0; }
  /* right panel */
  .rp { width:330px; background:var(--card); border-left:1px solid var(--border); display:flex; flex-direction:column; position:relative; }
  .tabs { display:flex; border-bottom:1px solid var(--border); padding:0 6px; }
  .tab { padding:9px 7px 7px; color:var(--sec); font-size:11.5px; font-weight:600; border-bottom:2px solid transparent; }
  .tab.on { color:var(--text); border-bottom-color:var(--accent); }
  .rbody { padding:8px 12px; }
  .grp { font-weight:700; margin:10px 0 4px; display:flex; align-items:center; gap:6px; }
  .grp .c { color:var(--sec); font-weight:500; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:0 3px; height:24px; border-bottom:1px solid var(--hover); }
  td.nm { font:13px "Times New Roman", serif; font-style:italic; width:56px; }
  td.v { text-align:right; font:11.5px "SF Mono", Menlo, monospace; }
  td.s { color:var(--sec); font-size:10.8px; padding-left:8px; }
  .kv { display:flex; height:22px; align-items:center; }
  .kv .k { width:92px; color:var(--sec); flex:none; }
  .foot { margin-top:auto; padding:7px 12px; border-top:1px solid var(--border); display:flex; color:var(--accent); font-weight:600; font-size:11.5px; gap:14px; }
  .foot span:last-child { margin-left:auto; }
  /* stale figure */
  .stale { display:flex; gap:20px; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,.08); overflow:hidden; }
  .banner { background:var(--warnbg); color:#6b4000; padding:9px 14px; border-bottom:1px solid #f0d9b0; line-height:1.5; }
  .banner b { color:var(--warn); }
  .banner .acts { margin-top:6px; display:flex; gap:8px; }
  .banner .acts span { border:1px solid #e7c58d; background:#fff; border-radius:6px; padding:2px 9px; color:var(--text); font-size:11.5px; }
  .banner .acts span.p { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .diff th { text-align:left; color:var(--sec); font-weight:600; font-size:10.5px; padding:6px 6px; border-bottom:1px solid var(--border);
             text-transform:uppercase; letter-spacing:.3px; }
  .diff td { height:30px; padding:0 6px; }
  .old { color:var(--sec); text-decoration:line-through; font:11.5px "SF Mono", Menlo, monospace; }
  .new { font:600 11.5px "SF Mono", Menlo, monospace; }
  .lbl { font-weight:600; color:var(--sec); font-size:11.5px; letter-spacing:.3px; margin-bottom:6px; }
  .vrow td { height:38px; }
  .ic { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-3px; margin-right:5px; }
  .ic.asm { background:linear-gradient(135deg,#5b8def 0 50%,#2f6ad8 50%); }
  .ic.ws { background:#6a3fc8; }
  .sp { white-space:nowrap; font-size:11.5px; }
  .sp.old2 { color:var(--warn); font-weight:600; }
</style>
</head>
