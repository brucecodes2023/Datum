<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PDM-04 vault client mock</title>
<style>
/* Tokens: src/Gui/Stylesheets/parameters/BruceWorx.yaml and "BruceWorx Dark.yaml" */
:root {
  --accent: #007aff; --accent-soft: rgba(0,122,255,.14); --accent-line: rgba(0,122,255,.55);
  --chrome: #e9e9ec; --chrome-2: #f3f3f5; --chrome-line: #d9d9de;
  --card: rgba(255,255,255,.72); --card-solid: #ffffff; --card-line: rgba(0,0,0,.10);
  --field: #ffffff; --field-line: #d9d9de; --grid-line: #ebebef;
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
  --hover: #e6e6ea; --shadow: 0 6px 24px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.08);
  --vp: #e0e2e8; --ok: #1f9d55; --warn: #c27c00; --err: #d93a3f;
  --badge-bg: rgba(29,29,31,.086); --badge-text: rgba(29,29,31,.67);
  --plate: transparent;
}
body.dark {
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,.22); --accent-line: rgba(10,132,255,.65);
  --chrome: #232326; --chrome-2: #2a2a2d; --chrome-line: #3a3a3d;
  --card: rgba(44,44,47,.72); --card-solid: #2c2c2f; --card-line: rgba(255,255,255,.10);
  --field: #1c1c1e; --field-line: #3a3a3d; --grid-line: #333336;
  --text: #ececef; --text-2: #a1a1a6; --text-3: #808085;
  --hover: #38383b; --shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  --vp: #33353a; --ok: #32d74b; --warn: #ffb340; --err: #ff6961;
  --badge-bg: rgba(236,236,239,.086); --badge-text: rgba(236,236,239,.67);
  --plate: rgba(255,255,255,.10);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body { font: 13px/1.3 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--text);
  background: var(--chrome); -webkit-font-smoothing: antialiased; }
img.ic { width: 24px; height: 24px; display: block; }
img.i16 { width: 16px; height: 16px; display: block; flex: none; }
img.i14 { width: 14px; height: 14px; display: block; flex: none; }
img.i20 { width: 20px; height: 20px; display: block; flex: none; }
svg.g { width: 16px; height: 16px; stroke: var(--text-2); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.st { width: 16px; height: 16px; flex: none; display: block; }
.mono { font: 11.5px/1.2 "SF Mono", Menlo, monospace; }

/* Title row (bruceworx_titlebar.py) */
.title { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; background: var(--chrome); }
.lights { display: flex; gap: 8px; margin-right: 12px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.qb { width: 32px; height: 26px; border-radius: 6px; background: var(--chrome-2); display: flex; align-items: center; justify-content: center; }
.qb img { width: 18px; height: 18px; }
.doctabs { display: flex; align-items: flex-end; height: 38px; gap: 2px; margin-left: 4px; }
.doctab { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 7px 7px 0 0; color: var(--text-2); min-width: 112px; }
.doctab.on { background: var(--chrome-2); color: var(--text); border: 1px solid var(--chrome-line); border-bottom: none; }
.doctab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2); margin-left: auto; }
.doctab .rev { color: var(--text-3); font-size: 11px; }
.doctab.plus { min-width: 0; font-size: 17px; color: var(--text-2); }
.search { margin-left: auto; width: 360px; height: 24px; border-radius: 6px; background: var(--field); border: 1px solid var(--field-line);
  display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--text-3); font-size: 12px; }
.search kbd { margin-left: auto; font: 10px -apple-system; color: var(--text-3); border: 1px solid var(--field-line); border-radius: 4px; padding: 0 4px; }

/* Workspace row and captioned groups (bruceworx_workspaces.py, bruceworx_groups.py) */
.tabsrow { height: 42px; display: flex; align-items: center; padding: 0 6px; background: var(--chrome-2); border-top: 1px solid var(--chrome-line); }
.ws { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 14px 0 10px; margin-right: 6px; border-radius: 7px;
  border: 1px solid var(--field-line); background: var(--field); font-weight: 700; font-size: 12.5px; }
.ws .car { font-size: 8px; margin-left: 2px; }
.tab { height: 42px; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .03em; color: var(--text-2); border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.quick { display: flex; gap: 6px; align-items: center; margin-left: 14px; }
.quick img { width: 22px; height: 22px; }
.quick .vs { width: 1px; height: 22px; background: var(--chrome-line); margin: 0 6px; }
.quick .dd { font-size: 8px; color: var(--text-2); margin-left: -4px; }
.toolbar { height: 66px; display: flex; align-items: stretch; padding: 4px 4px 0; background: var(--chrome-2); border-bottom: 1px solid var(--chrome-line); }
.grp { display: flex; flex-direction: column; align-items: center; padding: 0 6px; border-right: 1px solid var(--chrome-line); }
.grp:last-child { border-right: none; }
.grp .icons { display: flex; gap: 4px; height: 40px; align-items: center; }
.grp .icons span { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.grp .cap { font-size: 10px; font-weight: 600; letter-spacing: .05em; color: var(--text-2); margin-top: 3px; }
.grp .cap::after { content: " \25BE"; font-size: 8px; }

/* Viewport and cards */
.vp { position: relative; background: var(--vp); overflow: hidden; }
.card { position: absolute; background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); overflow: hidden; display: flex; flex-direction: column; }
.card.solid { background: var(--card-solid); }
.chead { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--text-2); }
.chead .r { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.chead .sub { font-weight: 400; letter-spacing: 0; color: var(--text); font-size: 12.5px; }

/* Browser tree (Gui/Tree.cpp [BW] row extras) */
.tree { padding: 2px 0 6px; flex: none; }
.row { height: 24px; display: flex; align-items: center; gap: 6px; padding-right: 10px; white-space: nowrap; position: relative; }
.row .chev { width: 12px; color: var(--text); font-size: 9px; text-align: center; flex: none; }
.row .lbl { overflow: hidden; text-overflow: ellipsis; flex: none; }
.row.root .lbl { font-weight: 700; font-size: 13.5px; }
.row .meta { color: var(--text-3); font-size: 12px; flex: none; }
.row .vs { margin-left: auto; display: flex; gap: 3px; align-items: center; justify-content: flex-end; flex: none; min-width: 35px; padding-left: 4px; }
.row.sel { background: var(--accent-soft); }
.row.dim .lbl { color: var(--text-3); }
.row.ro .lbl { color: var(--text-2); }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--badge-bg); color: var(--badge-text); font-weight: 600; flex: none; letter-spacing: .02em; }
.badge.warn { color: var(--warn); }
.badge.accent { color: var(--accent); }
.badge.ok { color: var(--ok); }
svg.eye { width: 15px; height: 15px; flex: none; }
.row img.i16 { background: var(--plate); border-radius: 4px; padding: 1px; box-sizing: content-box; margin: -1px 0; }
.split { height: 9px; flex: none; display: flex; justify-content: center; align-items: center; color: var(--text-3); font-size: 8px; letter-spacing: 1px; }
.props { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.pgrp { height: 22px; display: flex; align-items: center; padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .07em; color: var(--text-3); }
.prow { display: grid; grid-template-columns: 136px 1fr; height: 22px; align-items: center; margin: 0 6px 0 18px; border-bottom: 1px solid var(--grid-line); }
.prow .k { padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-right: 1px solid var(--grid-line); height: 100%; display: flex; align-items: center; }
.prow .v { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.prow .v.ro { color: var(--text-2); }
.ptabs { margin-top: auto; height: 30px; display: flex; gap: 18px; padding: 0 10px; align-items: stretch; flex: none; }
.ptabs span { display: flex; align-items: center; color: var(--text-2); border-bottom: 2px solid transparent; padding: 0 2px; }
.ptabs span.on { color: var(--text); border-bottom-color: var(--accent); }

/* Data panel */
.dp-vault { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px; }
.dp-vault b { font-size: 13px; }
.dp-vault .s { color: var(--text-3); font-size: 11.5px; }
.dp-vault .s .led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 4px; }
.dp-search { margin: 0 12px; height: 26px; border-radius: 6px; background: var(--field); border: 1px solid var(--field-line); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--text-3); font-size: 12.5px; }
.chips { display: flex; gap: 5px; padding: 8px 12px 6px; flex-wrap: nowrap; }
.fchip { height: 22px; padding: 0 7px; border-radius: 11px; border: 1px solid var(--field-line); display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; background: var(--field); }
.fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.fchip .n { font-size: 10.5px; color: var(--text-3); }
.fchip.on .n { color: rgba(255,255,255,.85); }
.dp-sort { display: flex; padding: 2px 12px 6px; color: var(--text-3); font-size: 11.5px; border-bottom: 1px solid var(--card-line); }
.dp-sort .r { margin-left: auto; }
.items { flex: 1; overflow: hidden; }
.item { display: grid; grid-template-columns: 48px 1fr auto; gap: 0 10px; padding: 7px 12px; border-bottom: 1px solid var(--card-line); align-items: center; position: relative; }
.item.sel { background: var(--accent-soft); }
.item.open::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.th { width: 48px; height: 48px; border-radius: 7px; background: #fff; border: 1px solid var(--card-line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
body.dark .th { background: #f2f2f4; }
.th img { width: 46px; height: 46px; object-fit: contain; }
.it-pn { font-weight: 600; font-size: 12.5px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.it-pn .rev { font-weight: 600; color: var(--text-2); }
.it-d { color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.it-s { overflow: hidden; display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.it-s .w { color: var(--warn); }
.it-s .a { color: var(--accent); }
.it-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: start; padding-top: 2px; }
.icons-r { display: flex; gap: 4px; }
.state { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; letter-spacing: .04em; }
.state.wip { background: rgba(255,159,10,.16); color: var(--warn); }
.state.rel { background: rgba(48,209,88,.16); color: var(--ok); }
.state.rev { background: var(--accent-soft); color: var(--accent); }
.state.obs { background: var(--badge-bg); color: var(--text-3); }
.mini { height: 20px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--field-line); background: var(--card-solid); font-size: 11px; display: flex; align-items: center; color: var(--text); }
.dp-foot { flex: none; padding: 8px 12px; border-top: 1px solid var(--card-line); color: var(--text-3); font-size: 11.5px; display: flex; gap: 8px; align-items: center; }
.avatar { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 8px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }

/* Nav pill, view cube */
.nav { position: absolute; bottom: 12px; height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 9px; background: var(--card-solid);
  border: 1px solid var(--card-line); box-shadow: var(--shadow); }
.nav span { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.nav .vs { width: 1px; height: 18px; background: var(--card-line); margin: 0 3px; }
.cubebox { position: absolute; width: 74px; height: 74px; perspective: 400px; }
.cube { position: absolute; left: 13px; top: 10px; width: 46px; height: 46px; transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(-45deg); }
.cube div { position: absolute; width: 46px; height: 46px; border: 1px solid rgba(0,0,0,.18); background: #fff; opacity: .95;
  display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; color: #6e6e73; letter-spacing: .04em; }
.cube .fr { transform: translateZ(23px); } .cube .rt { transform: rotateY(90deg) translateZ(23px); } .cube .tp { transform: rotateX(90deg) translateZ(23px); background: #f3f3f5; }

/* Status bar (bruceworx_statusbar.py) */
.status { height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: var(--chrome); border-top: 1px solid var(--chrome-line); color: var(--text-2); font-size: 12.5px; }
.status .r { margin-left: auto; display: flex; gap: 18px; align-items: center; }
.status .vault { display: flex; align-items: center; gap: 6px; padding: 1px 8px; margin-right: -8px; margin-left: 34px; border-radius: 6px; }
.status .vault .okc { color: var(--ok); }
.status .vault .w { color: var(--warn); display: flex; gap: 4px; align-items: center; }
.status .vault .a { color: var(--text); display: flex; gap: 4px; align-items: center; }
.status .vault .sep { color: var(--text-3); }

/* Context menu (BruceWorx.qss QMenu) */
.menu { position: absolute; z-index: 20; background: var(--card-solid); border: 1px solid var(--field-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.1); padding: 4px; font-size: 12px; min-width: 250px; }
.menu .mi { height: 23px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; margin: 0 2px; border-radius: 5px; white-space: nowrap; }
.menu .mi .ico { width: 16px; display: flex; justify-content: center; flex: none; }
.menu .mi .kb { margin-left: auto; color: var(--text-3); padding-left: 24px; }
.menu .mi .sub { margin-left: auto; color: var(--text-2); font-size: 9px; padding-left: 24px; }
.menu .mi .note { color: var(--text-3); margin-left: 6px; }
.menu .mi.on { background: var(--accent); color: #fff; }
.menu .mi.on .kb, .menu .mi.on .sub, .menu .mi.on .note { color: rgba(255,255,255,.85); }
.menu .mi.off { color: var(--text-3); }
.menu .mi.off img { opacity: .4; }
.menu .sec { padding: 6px 10px 3px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); display: flex; gap: 6px; align-items: center; }
.menu .sec .pn { font-weight: 600; letter-spacing: 0; color: var(--text-2); font-size: 11px; }
.menu hr { border: none; border-top: 1px solid var(--field-line); margin: 4px 8px; }
.menu .rv { width: 22px; font-weight: 700; }
.menu .ck { width: 12px; color: var(--accent); font-weight: 700; flex: none; }
.menu .mi.on .ck { color: #fff; }

/* Task panel (real Qt task box look; bruceworx_vaultwizard.py panels) */
.task { position: absolute; background: var(--card-solid); border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.thead { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; color: var(--text-2); font-weight: 600; font-size: 12px; flex: none; }
.thead .r { margin-left: auto; color: var(--text-3); font-size: 12px; }
.tbox { margin: 0 8px; border-top: 1px solid var(--field-line); }
.tbox .bh { height: 30px; display: flex; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); padding: 0 6px 0 4px; border-bottom: 1px solid var(--field-line); margin: 0 4px; }
.tbox .bh .r { margin-left: auto; font-size: 9px; }
.tbody { padding: 10px 14px 12px; }
.hint { color: var(--text-2); font-size: 12.5px; line-height: 1.35; }
.hint.sm { font-size: 12px; }
.tlabel { font-size: 13px; margin: 10px 0 5px; }
.textarea { border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); border-radius: 6px; background: var(--field); padding: 6px 8px; min-height: 62px; font-size: 13px; line-height: 1.35; }
.textarea .caret { display: inline-block; width: 1px; height: 15px; background: var(--text); vertical-align: -3px; margin-left: 1px; }
.qcb { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.qcb i { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #c7c7cc; background: var(--field); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.qcb i.on { background: var(--accent); border-color: var(--accent); }
.qcb i.on::after { content: ""; width: 7px; height: 4px; border-left: 1.8px solid #fff; border-bottom: 1.8px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
.qcb i.dis { background: var(--grid-line); border-color: var(--field-line); }
.tbl2 { margin-top: 4px; }
.tbl2 .h { display: grid; grid-template-columns: 26px 1fr 132px; font-size: 11.5px; font-weight: 600; color: var(--text-2); height: 24px; align-items: center; border-bottom: 1px solid var(--field-line); }
.tbl2 .r2 { display: grid; grid-template-columns: 26px 1fr 132px; min-height: 40px; align-items: center; border-bottom: 1px solid var(--grid-line); }
.tbl2 .r2 .nm { display: flex; gap: 7px; align-items: center; min-width: 0; }
.tbl2 .r2 .nm .t1 { font-size: 13px; white-space: nowrap; }
.tbl2 .r2 .nm .t2 { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.tbl2 .r2 .vv .t2 { font-size: 11.5px; color: var(--text-3); margin-top: 1px; white-space: nowrap; }
.tbl2 .r2.off .t1, .tbl2 .r2.off .mono { color: var(--text-3); }
.tbl2 .r2.off img { opacity: .5; }
.tbtns { margin-top: auto; display: flex; gap: 10px; justify-content: center; padding: 12px 0 14px; flex: none; }
.qbtn { height: 24px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--field-line); background: var(--card-solid); display: inline-flex; align-items: center; font-size: 13px; box-shadow: 0 .5px 1px rgba(0,0,0,.08); }
.qbtn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.linkrow { display: grid; grid-template-columns: 1fr; gap: 2px; margin-top: 6px; padding: 7px 9px; border-radius: 6px; background: var(--chrome-2); border: 1px solid var(--grid-line); }
.linkrow .mono { font-size: 11px; color: var(--text); }

/* State legend */
.sheet { padding: 22px 26px; }
.sheet h3 { margin: 0 0 3px; font-size: 15px; }
.sheet p.lead { margin: 0 0 14px; color: var(--text-2); }
.legend { border: 1px solid var(--card-line); border-radius: 10px; background: var(--card-solid); overflow: hidden; }
.lg { display: grid; grid-template-columns: 54px 226px 1fr 380px; align-items: center; min-height: 40px; border-bottom: 1px solid var(--grid-line); padding: 4px 0; }
.lg:last-child { border-bottom: none; }
.lg.h { min-height: 28px; background: var(--chrome-2); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--text-3); }

.lg .ico { display: flex; justify-content: center; gap: 3px; align-items: center; }
.lg .ico svg.st { width: 18px; height: 18px; }
.lg .nm { font-weight: 600; }
.lg .ds { color: var(--text-2); font-size: 12.5px; }
.lg .ac { font-size: 12.5px; }
.lg .ac .ro, .lg .ds .ro { font-weight: 700; color: var(--text); }
.lg.lc { grid-template-columns: 110px 170px 1fr 330px; min-height: 34px; }
.lg.lc .ico { justify-content: flex-start; }
.lcrow { display: flex; gap: 18px; margin-top: 14px; align-items: center; flex-wrap: wrap; color: var(--text-2); font-size: 12.5px; }
.lcrow .item2 { display: flex; gap: 7px; align-items: center; }

<body>
<div id="app"></div>
<script>
const Q = new URLSearchParams(location.search);
const FIG = Q.get("fig") || "overview";
if (Q.get("theme") === "dark") document.body.classList.add("dark");

function statesFig() {

  const L = [
    [["notin"], "Not in vault", "A file outside the vault: a new part, or one from elsewhere.", "Edit freely. Check In adds it and gives it a part number."],
    [["latest"], "Checked in (latest)", "Your copy is the newest version and nobody has it out.", 'Check Out to edit. Until then <span class="ro">read-only</span>.'],
    [["mine"], "Checked out by me", "Locked to you. The file in work/ is yours to change.", "Edit and save; Check In, or Undo Check-Out."],
    [["other"], "Checked out by someone else", "Dana Kim has it out. You see the last checked-in version.", '<span class="ro">Read-only.</span> Wait for their check-in.'],
    [["newer"], "Newer version in vault", "Someone checked in after your copy was fetched.", "Get Latest (needs no check-out)."],
    [["mine", "modified"], "Modified locally", "Saved changes that are not checked in yet. Shown next to the lock.", "Check In to keep them, Undo Check-Out to drop them."],
    [["released"], "Released", "An approved letter revision (A, B, …). It never changes.", '<span class="ro">Read-only.</span> Changes go ECR → ECO → next letter.'],
  ];
  return `<div class="sheet"><h3>Vault status in the Browser and the Data panel</h3>
    <p class="lead">One icon per row, at the right of the Browser row and of the Data panel item. The lifecycle chip (WIP, review, released) is shown separately.</p>

    ${L.map(([icons, n, d, a]) => `<div class="lg"><span class="ico">${icons.map(s => ST[s]).join("")}</span><span class="nm">${n}</span><span class="ds">${d}</span><span class="ac">${a}</span></div>`).join("")}</div>
    <h3 style="margin-top:18px">Lifecycle state (ASME Y14.35 revisions)</h3>
    <p class="lead">Shown next to the status icon: a badge in the Browser, a chip in the Data panel. The part number never carries the revision; it is shown as P/N-REV, e.g. BW-01-01001-001-03.</p>
    <div class="legend">
      <div class="lg h lc"><span>BROWSER</span><span>DATA PANEL</span><span>MEANING</span><span>NEXT</span></div>
      <div class="lg lc"><span class="ico"><span class="badge warn">WIP 03</span></span><span><span class="state wip">WIP</span></span><span class="ds">Work revision 01, 02, 03 … Editable by whoever checks it out.</span><span class="ac">Submit for review.</span></div>
      <div class="lg lc"><span class="ico"><span class="badge accent">REVIEW 03</span></span><span><span class="state rev">IN REVIEW</span></span><span class="ds">Waiting for approval. <span class="ro">Read-only</span> for everyone.</span><span class="ac">Rejected: next work revision (04). Approved: A.</span></div>
      <div class="lg lc"><span class="ico"><span class="badge">REV A</span></span><span><span class="state rel">RELEASED</span></span><span class="ds">First approval releases A. B, C … only through ECR → ECO.</span><span class="ac">ECO approved: next letter.</span></div>
      <div class="lg lc"><span class="ico"><span class="badge" style="opacity:.6">OBSOLETE</span></span><span><span class="state obs">OBSOLETE</span></span><span class="ds">Replaced or withdrawn; kept for history.</span><span class="ac">None.</span></div>
    </div></div>
  </div>`;
}
