<!doctype html>
<!-- PDM-10 mock (24 Oct): the vault dashboard, the vault side of the BruceWorx Start page.
     Tokens from src/Gui/Stylesheets/parameters/BruceWorx(.yaml| Dark.yaml) and the "BruceWorx Start page"
     blocks of BruceWorx.qss. ?theme=light|dark&fig=full|empty; rendered by render.sh. Invented sample data. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#F3F3F5; --card:#FFFFFF; --border:#D9D9DE; --grid:#EBEBEF; --text:#1D1D1F; --sec:#6E6E73; --dim:#86868B;
          --accent:#007AFF; --soft:#DCEBFF; --hover:#E6E6EA; --ok:#1F9D55; --warn:#C27C00; --err:#D93A3F; --obs:#B4B4BA;
          --rev:#007AFF; }
  body.dark { --bg:#2A2A2D; --card:#2C2C2F; --border:#3A3A3D; --grid:#333336; --text:#ECECEF; --sec:#A1A1A6; --dim:#808085;
          --accent:#0A84FF; --soft:#1F3A5C; --hover:#38383B; --ok:#32D74B; --warn:#FFB340; --err:#FF6961; --obs:#5A5A5F;
          --rev:#0A84FF; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:13px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
         display:flex; height:100vh; overflow:hidden; }
  /* left column: as bruceworx_start.py (248 px, captions, 32 px rows) */
  .side { width:248px; box-sizing:border-box; padding:18px 14px 14px; border-right:1px solid var(--border); display:flex;
          flex-direction:column; gap:2px; flex:none; }
  .cap { color:var(--dim); font-size:10px; font-weight:700; letter-spacing:.7px; padding:0 4px 4px; }
  .it { height:32px; display:flex; align-items:center; gap:9px; padding:0 8px; border-radius:7px; }
  .it .k { margin-left:auto; color:var(--dim); font-size:11px; }
  .it.on { background:var(--soft); font-weight:600; }
  .gap { height:10px; }
  .vs { display:flex; align-items:center; gap:7px; padding:5px 6px; font-weight:600; border-radius:6px; }
  .vs .sub { font-weight:400; color:var(--sec); font-size:11.5px; display:block; }
  .sp { flex:1; }
  /* icons */
  .i { width:18px; height:18px; flex:none; display:inline-block; vertical-align:-4px; }
  .main { flex:1; padding:18px 24px; display:flex; flex-direction:column; gap:14px; min-width:0; }
  .hdr { display:flex; align-items:center; gap:12px; }
  .hdr .t { font-size:20px; font-weight:700; }
  .hdr .s { color:var(--sec); font-size:12px; margin-top:2px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin:0 4px 1px 0; vertical-align:middle; }
  .btn { border:1px solid var(--border); background:var(--card); border-radius:6px; padding:4px 11px; font-size:12.5px; }
  .btn.p { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .title { font-size:15px; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .ch { display:flex; align-items:center; gap:8px; padding:9px 12px 7px; }
  .ch .title { font-size:13.5px; }
  .ch .more { margin-left:auto; color:var(--accent); font-size:12px; }
  .ch .n { color:var(--sec); font-size:12px; }
  /* tiles */
  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  .tile { padding:11px 13px 11px; position:relative; }
  .tile .lab { color:var(--sec); font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .tile .num { font-size:26px; font-weight:700; margin:3px 0 7px; font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .tile .chev { position:absolute; right:12px; top:11px; color:var(--dim); }
  .bar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--grid); gap:1px; }
  .bar span { display:block; height:100%; }
  .w { background:var(--warn); } .r { background:var(--rev); } .g { background:var(--ok); } .o { background:var(--obs); }
  .leg { display:flex; gap:10px; margin-top:7px; font-size:11px; color:var(--sec); font-variant-numeric:tabular-nums; flex-wrap:wrap; }
  .leg i { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:4px; vertical-align:0; }
  .leg b { color:var(--text); font-weight:600; }
  .grid2 { display:grid; grid-template-columns:1.45fr 1fr; gap:14px; min-height:0; }
  .colm { display:flex; flex-direction:column; gap:14px; min-width:0; }
  /* tables like bwStartTable */
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:left; background:var(--hover); color:var(--dim); font-size:10px; font-weight:700; letter-spacing:.4px;
       padding:5px 8px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  td { padding:0 8px; height:30px; border-bottom:1px solid var(--grid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  tr:last-child td { border-bottom:none; }
  td.sec { color:var(--sec); }
  tr.grp td { color:var(--sec); font-size:11px; letter-spacing:.3px; height:26px; }
  tr.grp td b { color:var(--text); font-weight:600; }
  .pn { font-variant-numeric:tabular-nums; }
  .badge { font-size:9px; font-weight:700; padding:0 4px; border:1px solid var(--border); border-radius:4px; color:var(--sec);
           line-height:14px; display:inline-block; letter-spacing:.2px; }
  .badge.wip { color:var(--warn); border-color:var(--warn); }
  .badge.rel { color:var(--ok); border-color:var(--ok); }
  .badge.rev { color:var(--accent); border-color:var(--accent); background:var(--soft); }
  .badge.u { color:var(--sec); }
  .warnt { color:var(--warn); font-weight:600; }
  .acc { color:var(--accent); }
  /* projects */
  .proj { display:grid; grid-template-columns:22px 1fr 170px 160px; align-items:center; gap:10px; padding:8px 12px;
          border-top:1px solid var(--grid); }
  .proj .nm { font-weight:600; }
  .proj .pn2 { color:var(--sec); font-size:11.5px; }
  .proj .bar { height:8px; border-radius:4px; }
  .proj .st { font-size:11.5px; color:var(--sec); text-align:right; line-height:15px; }
  .proj .st b { color:var(--text); }
  /* activity */
  .day { color:var(--dim); font-size:10px; font-weight:700; letter-spacing:.6px; padding:6px 12px 2px; }
  .ev { display:grid; grid-template-columns:18px 1fr auto; gap:8px; padding:4px 12px; align-items:start; font-size:12.3px; line-height:17px; }
  .ev .tm { color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .ev .who { font-weight:600; }
  .ev .wh { color:var(--sec); }
  .spark { display:flex; align-items:flex-end; gap:2px; height:22px; padding:0 12px 4px; }
  .spark span { flex:1; background:var(--accent); opacity:.55; border-radius:1px 1px 0 0; min-height:1px; }
  .spark span.t { opacity:1; }
  .seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; font-size:11.5px; background:var(--card); }
  .seg div { padding:1px 8px; color:var(--sec); border-left:1px solid var(--border); }
  .seg div:first-child { border-left:none; }
  .seg div.on { background:var(--soft); color:var(--text); font-weight:600; }
  /* health */
  .hl { display:grid; grid-template-columns:14px 1fr auto; gap:6px; padding:5px 12px; font-size:12.3px; align-items:center;
        border-top:1px solid var(--grid); }
  .hl .r2 { color:var(--sec); font-size:11.5px; }
  /* change rows */
  .chip { font-size:9px; font-weight:700; padding:0 5px; border-radius:4px; line-height:15px; display:inline-block; letter-spacing:.3px; }
  .chip.open { color:var(--warn); background:color-mix(in srgb, var(--warn) 16%, transparent); }
  .chip.appr { color:var(--accent); background:var(--soft); }
  /* recent */
  .rh { display:flex; align-items:center; gap:10px; }
  .filter { margin-left:auto; width:240px; border:1px solid var(--border); background:var(--card); border-radius:6px; height:22px;
            color:var(--dim); font-size:12px; display:flex; align-items:center; padding:0 8px; box-sizing:border-box; }
  .cards { display:grid; grid-template-columns:repeat(5, 1fr); gap:14px; }
  .rc { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .rc .th { height:66px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--grid); }
  .rc .inf { padding:6px 10px 8px; font-size:12px; line-height:17px; }
  .rc .inf b { font-weight:600; display:block; }
  .rc .inf span { color:var(--sec); }
  .foot { color:var(--sec); font-size:12px; display:flex; gap:6px; }
  .foot .acc { color:var(--accent); }
  .muted { color:var(--sec); }
  /* empty vault */
  .steps { padding:4px 0 6px; }
  .step { display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:9px 14px; border-top:1px solid var(--grid); }
  .step .n { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center;
             justify-content:center; font-size:11px; font-weight:700; color:var(--sec); }
  .step .n.done { background:var(--ok); border-color:var(--ok); color:#fff; }
  .step .d { color:var(--sec); font-size:12px; margin-top:1px; }
  .step .t { font-weight:600; }
  .note { position:absolute; right:10px; bottom:6px; font-size:10px; color:var(--dim); }
</style>
</head>
