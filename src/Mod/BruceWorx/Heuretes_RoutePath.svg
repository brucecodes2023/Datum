  <circle cx="36" cy="20" r="5" fill="#1f6feb" stroke="#2b2f36" stroke-width="2"/>
  <circle cx="54" cy="14" r="5" fill="#1f6feb" stroke="#2b2f36" stroke-width="2"/>
</svg>
